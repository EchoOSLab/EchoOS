[workspace]
resolver = "3"
members = [
    "crates/api/echo-pal-api",
    "crates/arch/echo-arch-api",
    "crates/arch/echo-arch-cortex-m",
    "crates/arch/echo-arch-mock",
    "crates/core/echo-trace",
    "crates/kernel/echo-ipc",
    "crates/kernel/echo-sched",
    "crates/kernel/echo-time",
    "crates/test/echo-bench",
    "crates/test/echo-conformance",
    "tools/codegen",
    "bsp/echo-bsp-qemu-cortex-m",
    "bsp/echo-bsp-qemu-mps2",
    "bsp/echo-bsp-qemu-riscv-virt",
    "bsp/echo-bsp-qemu-x86",
    "bsp/echo-bsp-nucleo-h743zi",
    "bsp/echo-bsp-weact-h750vb",
    "xtask",
]
# 裸机 BSP 不在默认成员中：裸 cargo build/test 只碰 host 可编译部分
default-members = [
    "crates/api/echo-pal-api",
    "crates/arch/echo-arch-api",
    "crates/arch/echo-arch-cortex-m",
    "crates/arch/echo-arch-mock",
    "crates/core/echo-trace",
    "crates/kernel/echo-ipc",
    "crates/kernel/echo-sched",
    "crates/kernel/echo-time",
    "crates/test/echo-bench",
    "crates/test/echo-conformance",
    "tools/codegen",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
echo-arch-api = { path = "crates/arch/echo-arch-api" }
echo-arch-cortex-m = { path = "crates/arch/echo-arch-cortex-m" }
echo-arch-mock = { path = "crates/arch/echo-arch-mock" }
echo-ipc = { path = "crates/kernel/echo-ipc" }
echo-pal-api = { path = "crates/api/echo-pal-api" }
echo-sched = { path = "crates/kernel/echo-sched" }
echo-time = { path = "crates/kernel/echo-time" }
echo-bench = { path = "crates/test/echo-bench" }
echo-trace = { path = "crates/core/echo-trace" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
